<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Bulmacayı çözerek sınav notunu öğren">
  <title>Not Bulmaca</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <h1>Not Bulmaca</h1>
      <p>Bulmacayı çöz, notunu gör</p>
    </header>

    <div id="networkInfo" class="card network-card message info hidden"></div>

    <div id="statusBar" class="status-bar hidden"></div>

    <div id="emptyState" class="card empty-state hidden">
      <p>Henüz bir not ayarlanmadı. Lütfen daha sonra tekrar deneyin.</p>
    </div>

    <div id="puzzleSection" class="card hidden">
      <span id="puzzleTypeBadge" class="puzzle-type-badge"></span>
      <p id="puzzleQuestion" class="puzzle-question"></p>

      <div id="mathInput" class="hidden">
        <label for="answerInput">Cevabınız</label>
        <input type="number" id="answerInput" inputmode="numeric" placeholder="Sayı girin" autocomplete="off">
      </div>

      <div id="mcqInput" class="mcq-options hidden"></div>

      <button type="button" class="btn btn-primary" id="submitBtn">Gönder</button>
      <p class="attempts-info" id="attemptsInfo">Kalan hak: 3</p>
    </div>

    <div class="admin-link">
      <a href="admin.html">Yönetim</a>
    </div>
  </div>

  <div id="lockOverlay" class="lock-overlay hidden">
    <div class="lock-card">
      <h2>Yanlış!</h2>
      <p>3 kez yanlış cevap verdiniz. Sisteme tekrar girmek için aşağıdaki butona basın.</p>
      <button type="button" class="btn btn-primary" id="retryBtn">Tekrar dene</button>
    </div>
  </div>

  <dialog id="successModal" class="modal">
    <div class="modal-inner success">
      <h2>Tebrikler!</h2>
      <p>Doğru cevap! Sınav notunuz:</p>
      <div class="grade-display" id="gradeDisplay">—</div>
      <button type="button" class="btn btn-primary" id="closeSuccessBtn">Tamam</button>
    </div>
  </dialog>

  <script type="module" src="js/user-app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
